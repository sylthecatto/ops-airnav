# new-app Ingress — routes new-app-staging.192.168.8.121.nip.io to new-app-svc via Traefik
# nip.io is public wildcard DNS that resolves <anything>.<IP>.nip.io -> <IP> automatically.
# No hosts-file edits needed on any machine - works for anyone on the network with normal DNS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-app-ingress
  namespace: startup
spec:
  ingressClassName: traefik
  rules:
  - host: new-app-staging.192.168.8.121.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: new-app-svc
            port:
              number: 80
